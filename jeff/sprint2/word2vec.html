<div class="wrap"><header class="top"><h1 id="titulo">Como o contexto vira vetor</h1><nav class="rail" id="rail" aria-label="Estações"></nav><div class="tools"><button type="button" class="btn ghost quad" id="reset" aria-label="Reiniciar demonstração" title="Reiniciar demonstração">↺</button></div></header><main id="station"></main></div>
<script>
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (q, root=document) => root.querySelector(q);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const ICONS = {
  play: '<path d="M8 5.5v13l10-6.5z" fill="currentColor" stroke="none"/>',
  pausa: '<path d="M8 5v14M16 5v14" stroke-width="3"/>',
  recomecar: '<path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v4h4"/>',
  esq: '<path d="M15 5 8 12l7 7"/>', dir: '<path d="m9 5 7 7-7 7"/>',
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  vocab: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  lixeira: '<path d="M5 7h14M9 7V4h6v3M8 7l1 13h6l1-13"/>',
  grade: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/>',
  janela: '<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M9 7v10M15 7v10"/>',
  rede: '<circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 7l3 3.5M7 17l3-3.5M14 10.5 17 7M14 13.5l3 3.5"/>',
  passo: '<path d="M5 19 19 5M12 5h7v7"/>',
  plano: '<path d="M4 20V4M4 20h16"/><circle cx="9" cy="14" r="1.6"/><circle cx="15" cy="9" r="1.6"/>',
  entrada: '<path d="M20 12h-9M14 6l-6 6 6 6"/><path d="M4 5v14"/>',
  lupa: '<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
};
function icon(n) { const sp = document.createElement('span'); sp.className = 'ic'; sp.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`; return sp; }


const n2 = n => (n < -.005 ? '−' : '') + Math.abs(n).toFixed(2).replace('.', ',');
const FRASES_LONGAS = ['hoje eu bebi um café quente depois do almoço', 'hoje eu bebi um chá quente depois do almoço', 'hoje eu bebi um xurupa quente depois do almoço'];
const TOKENS_LONGOS = FRASES_LONGAS.map(f => f.split(' '));
const FRASES = ['bebi um café quente', 'bebi um chá quente', 'bebi um xurupa quente'];
const TOKENS = FRASES.map(f => f.split(' '));
const VOC = [...new Set(TOKENS.flat())];
const IX = Object.fromEntries(VOC.map((w,i) => [w,i]));
const LR = .1, EPOCHS = 300;
const clone = A => A.map(r => r.slice());
const dot = (a,b) => a[0]*b[0]+a[1]*b[1];
function softmax(z) { const m=Math.max(...z), ex=z.map(v=>Math.exp(v-m)), sum=ex.reduce((a,b)=>a+b,0); return ex.map(v=>v/sum); }
const predict = (F,v) => softmax(F.O.map(r=>dot(r,v)));
function rng(seed) { let s=seed>>>0; return () => {s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;}; }
function assigned(seed) {
  const r=rng(seed), extra=rng(seed ^ 0x9e3779b9);
  return VOC.map(()=>[r()*2-1,r()*2-1,extra()*2-1]);
}
function initial(seed) {
  const r=rng(seed); VOC.forEach(()=>{r();r();});
  return {I:state.values.map(v=>v.slice(0,2)),O:VOC.map(()=>[r()*2-1,r()*2-1])};
}
function examples(radius, model) {
  return TOKENS.flatMap((t,f)=>t.flatMap((w,i)=>{
    const neighbors=t.map((_,j)=>j).filter(j=>j!==i&&Math.abs(j-i)<=radius);
    return model==='cb' ? [{f,i,js:neighbors,inputs:neighbors.map(j=>IX[t[j]]),answer:IX[w]}]
      : neighbors.map(j=>({f,i,js:[j],inputs:[IX[w]],answer:IX[t[j]]}));
  }));
}
function update(F,ex) {
  const v=[0,1].map(d=>ex.inputs.reduce((sum,i)=>sum+F.I[i][d],0)/ex.inputs.length);
  const g=predict(F,v);g[ex.answer]-=1;
  const gv=[0,1].map(d=>F.O.reduce((sum,r,j)=>sum+r[d]*g[j],0));
  F.O.forEach((r,j)=>r.forEach((_,d)=>r[d]-=LR*g[j]*v[d]));
  ex.inputs.forEach(i=>[0,1].forEach(d=>F.I[i][d]-=LR*gv[d]/ex.inputs.length));
}
const copyFrame = F => ({I:clone(F.I),O:clone(F.O)});
const defaults=()=>({radius:1,seed:31,values:assigned(31),dimensions:1,word:'café',phrase:0,target:4,parE4:0,correctionPhase:0,linha:null,modoPasso:false,sgTick:0,cbTick:0,sgExample:0,cbExample:2,cbPhase:0});
const state=defaults();
let models={},current=0,timer=null;
function model(kind='sg') {
  if(models[kind]) return models[kind];
  let ex=examples(1,kind);
  if(kind==='sg'){const c=ex.findIndex(x=>x.f===0&&TOKENS[0][x.i]==='café'&&TOKENS[0][x.js[0]]==='um');ex=ex.slice(c).concat(ex.slice(0,c));}
  const F=initial(state.seed),frames=[copyFrame(F)];
  for(let e=0;e<EPOCHS;e++){ex.forEach(x=>update(F,x));frames.push(copyFrame(F));}
  const pts=frames.flatMap(F=>F.I);
  const lim=d=>Math.max(1.4,...pts.map(v=>Math.abs(v[d])))+.45;
  return models[kind]={ex,frames,Rx:lim(0),Ry:lim(1),cacheEpoch:-1,steps:[]};
}
function frame(kind,tick) {
  const M=model(kind),N=M.ex.length,epoch=Math.floor(tick/N),rem=tick%N;
  if(!rem) return M.frames[epoch];
  if(M.cacheEpoch!==epoch){const F=copyFrame(M.frames[epoch]);M.steps=[copyFrame(F)];M.ex.forEach(ex=>{update(F,ex);M.steps.push(copyFrame(F));});M.cacheEpoch=epoch;}
  return M.steps[rem];
}
function resetTraining(){stop();models={};state.sgTick=state.cbTick=0;state.sgExample=state.cbPhase=state.correctionPhase=0;state.cbExample=2;state.linha=null;state.modoPasso=false;}
function reshuffle(){state.seed=(state.seed+1)>>>0;state.values=assigned(state.seed);resetTraining();render();}
function stop(){if(timer)clearInterval(timer);timer=null;}
const STATIONS=[
  {id:'contexto',title:'Contexto',ic:'janela'},
  {id:'numeros',title:'Quantos números por palavra?',ic:'grade'},
  {id:'posicoes',title:'Dois números, uma posição',ic:'plano'},
  {id:'exemplos',title:'Do contexto aos pares',ic:'janela'},
  {id:'corrigir',title:'Uma correção de cada vez',ic:'passo'},
  {id:'treino',title:'Repetir as correções',ic:'plano'},
  {id:'rede',title:'Os mesmos pesos na rede',ic:'rede'},
  {id:'embedding',title:'O embedding de cada palavra',ic:'lupa'},
  {id:'skipgram',title:'Skip-gram: da palavra ao contexto',ic:'rede'},
  {id:'cbow',title:'CBOW: do contexto à palavra',ic:'entrada'}
];
const stationId=()=>STATIONS[current].id;
const button=(label,action,cls='btn ghost',props={})=>h('button',{type:'button',class:cls,onclick:action,...props},label);
function phrase(f,target,neighbors,interactive=false,toks=TOKENS,outros=[]){
  return h('div',{class:'sentence'+(interactive?'':' small')},toks[f].map((w,i)=>h(interactive?'button':'span',{
    ...(interactive?{type:'button',onclick:()=>{state.target=i;render();},'aria-pressed':String(i===target)}:{}),
    class:'token'+(i===target?' target':neighbors.includes(i)?' context':outros.includes(i)?' outro-contexto':'')
